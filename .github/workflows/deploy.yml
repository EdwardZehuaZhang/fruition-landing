name: Deploy

# Cloudflare Workers deploy pipeline for the OpenNext build.
#
#   * Every pull request  -> uploads a NEW preview version (does NOT touch
#     production) via `wrangler versions upload`, then posts/updates a comment
#     on the PR with the generated preview URL.
#   * Push to `production` -> promotes the build to the live Worker via
#     `wrangler deploy`.
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   Secrets:
#     CLOUDFLARE_API_TOKEN            Token with "Edit Cloudflare Workers" perms
#     CLOUDFLARE_ACCOUNT_ID          Cloudflare account id
#   Variables (public Sanity values, inlined into the build):
#     NEXT_PUBLIC_SANITY_PROJECT_ID
#     NEXT_PUBLIC_SANITY_DATASET
#     NEXT_PUBLIC_SANITY_API_VERSION
#
# Preview URLs require the Worker's workers.dev preview URLs to be enabled
# (Cloudflare dashboard -> the Worker -> Settings -> Domains & Routes ->
# Preview URLs). If disabled, the version still uploads but no URL is printed.

on:
  pull_request:
  push:
    branches: [production]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Upload preview version to Cloudflare
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
        run: |
          set -o pipefail
          npm run upload 2>&1 | tee upload.log
          # wrangler prints e.g. "Version Preview URL: https://<hash>-fruition-landing.<sub>.workers.dev"
          # "|| true": no match must not fail the step (Actions runs bash -e) —
          # a missing URL just means preview URLs are disabled for the Worker,
          # which the branch below and the PR comment already handle.
          URL="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -1 || true)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then echo "Preview URL: $URL"; else echo "No preview URL found (are preview URLs enabled for this Worker?)"; fi

      - name: Comment preview URL on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- cf-preview-deploy -->';
            const body = url
              ? `${marker}\n### ⚡ Cloudflare preview deployed\n\n**${url}**\n\nUpdated automatically on every push to this PR (commit \`${context.sha.slice(0,7)}\`).`
              : `${marker}\n### ⚡ Cloudflare preview\n\nThe preview version uploaded, but no preview URL was returned. Enable **Preview URLs** for the \`fruition-landing\` Worker in the Cloudflare dashboard (Settings → Domains & Routes → Preview URLs), then re-run this job.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}

  deploy:
    name: Production deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Deploy to Cloudflare (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
        run: npm run deploy
